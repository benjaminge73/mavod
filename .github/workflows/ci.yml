name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dev deps
        run: pip install -r requirements/dev.txt

      # Unit tests are fully mocked (respx for HTTP) — no real secrets needed.
      - name: Unit tests
        run: pytest -m unit -v

  # Merge automatique au vert : PR de l'owner ou de Dependabot (tous types de
  # mises à jour, majors comprises). Remplace l'auto-merge natif GitHub.
  #
  # mavod est un depot vitrine : le seul controle avant merge est la CI. Le gate
  # de relecture automatique (dependabot-review-gate.yml + review-required.txt)
  # a ete retire le 2026-08-07 — il flaguait des paquets dont la regression ne
  # se voit pas ici, au prix d'une PR bloquee a la main a chaque fois.
  auto-merge:
    name: auto-merge
    needs: unit
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      (github.event.pull_request.user.login == github.repository_owner ||
       github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Le label n'est plus pose par aucun workflow : il reste comme frein
      # manuel. Poser `review-required` a la main sur une PR suspend son
      # auto-merge, le retirer le relance au prochain push ou re-run.
      - name: Verifie l'absence de flag de relecture
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr view ${{ github.event.pull_request.number }} --repo ${{ github.repository }} \
               --json labels --jq '.labels[].name' | grep -qx 'review-required'; then
            echo "hold=true" >> "$GITHUB_OUTPUT"
            echo "::notice::PR flaguee review-required, auto-merge suspendu."
          else
            echo "hold=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Squash-merge la PR et supprime la branche
        if: steps.gate.outputs.hold != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh pr merge ${{ github.event.pull_request.number }}
          --squash --delete-branch --repo ${{ github.repository }}
