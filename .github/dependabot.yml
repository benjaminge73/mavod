# Surveillance des dépendances — géré par Dependabot.
# Les mises à jour de SÉCURITÉ ne passent pas par ce fichier : elles sortent
# en PR individuelles et immédiates dès qu'une alerte CVE est levée.
# Ci-dessous : uniquement les version updates hebdomadaires.
# Les majeures restent hors groupe volontairement (1 PR par paquet).

version: 2

updates:
  # Scanné sur /requirements et non sur la racine : la racine ne déclare aucune
  # dépendance directe (requirements.txt = `-r requirements/dev.txt`) et sa
  # chaîne d'inclusion s'arrête à dev.txt → base.txt, ce qui laissait ui.txt
  # (streamlit, conteneur mavod-ui) hors surveillance. Pointer le dossier fait
  # ramasser base.txt, dev.txt ET ui.txt par un seul bloc, sans doublon.
  - package-ecosystem: "pip"
    directory: "/requirements"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    # ui.txt déclare streamlit en range (>=1.40.0,<2.0) : sans `increase`, une
    # release 1.x satisfait déjà la contrainte et ne déclencherait aucune PR.
    versioning-strategy: increase
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    groups:
      actions:
        patterns:
          - "*"
